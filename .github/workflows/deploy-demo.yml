name: Publish TradingNinjaPro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build v0.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - name: Build project Pages site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run check:size
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Build root-path 20i package
        run: npm run build && cd dist && zip -qr ../TradingNinjaPro-20i-website.zip .
        env:
          BASE_PATH: /
      - uses: actions/upload-artifact@v4
        with:
          name: TradingNinjaPro-20i-website
          path: TradingNinjaPro-20i-website.zip
          retention-days: 14
  deploy:
    name: Publish live preview
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
